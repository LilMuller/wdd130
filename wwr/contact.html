<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact The Rapids for reservations, inquiries, and adventure planning. Reach out to our team today.">
    <meta name="author" content="Okon Victor John">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us</title>
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="The Rapids logo" width="128" height="128">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div style="text-align: center;">
            <h1>The Rapids Rafting Company</h1>
            <p> 123 River Road, Adventure City</p>
            <p>+234 800 123 4567</p>
            <p>info@therapids.com</p>
        </div>

        <section class="contact-info contact">
            <div class="columns-2">

                <iframe src="https://www.google.com/maps?q=lagos&output=embed"></iframe>

                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="johndoe@gmail.com">

                    <p>Message Purpose</p>

                    <label>
                        <input type="radio" id="general" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>

                    <label>
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>
        </section>

        <section class="employees">
            <h1>WE Are Here ro Serve You</h1>

            <figure>
                <img src="images/employee1.jpg" alt="River Guide">
                <figcaption>John Doe – Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee1.jpg" alt="Safety Officer">
                <figcaption>Jane Smith – Safety Officer</figcaption>
            </figure>

            <figure>
                <img src="images/employee1.jpg" alt="Tour Manager">
                <figcaption>Mike Johnson – Tour Manager</figcaption>
            </figure>
        </section>


    </main>

    <footer>
        <p>&copy;2026 The Rapids, Okon Victor John</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
