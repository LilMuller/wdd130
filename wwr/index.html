<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="The Rapids - Experience thrilling whitewater rafting adventures.">
    <meta name="author" content="Okon Victor John">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home - The Rapids</title>
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="The Rapids logo" width="128">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero">
            <img src="images/hero-img.jpg" alt="rafting adventure">
            <h1>Experience the Rapids</h1>
        </section>

        <section class="cta">
            <h2>Ready for Adventure?</h2>
            <a href="trips.html" class="btn">View Our Trips</a>
        </section>

        <section class="grid">
            <div>
                <img src="images/ad1.jpeg" alt="rafting">
                <h3>Thrilling Rapids</h3>
                <p>Challenge yourself with exciting whitewater experiences.</p>
            </div>

            <div>
                <img src="images/ad2.jpg" alt="nature">
                <h3>Beautiful Scenery</h3>
                <p>Enjoy breathtaking views while rafting.</p>
            </div>
        </section>

        <!-- NEWSLETTER -->
        <section class="newsletter">
            <h2>Join Our Newsletter</h2>
            <form>
                <label for="nname">Name:</label>
                <input type="text" id="nname" name="name">

                <label for="nemail">Email:</label>
                <input type="email" id="nemail" name="email">

                <button type="submit">Join Now</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy;2026 The Rapids, Okon Victor John</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
